name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir -p /tmp/dist_output
          if [ -f "package.json" ]; then
            rm -f bun.lock
            npm install
            npm run build
            touch dist/.nojekyll
            cp -r dist/* /tmp/dist_output/
          else
            cd *dispensary* || cd */
            rm -f bun.lock
            npm install
            npm run build
            touch dist/.nojekyll
            cp -r dist/* /tmp/dist_output/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/dist_output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
