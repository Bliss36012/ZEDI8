<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neemaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Rectangle -->
  <rect width="512" height="512" rx="100" fill="url(#neemaGradient)"/>

  <!-- Subtle Emblem Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8"/>

  <!-- Hospital Emerald Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="216" y="116" width="80" height="280" rx="16" fill="#ffffff"/>
    <!-- Horizontal Cross Bar -->
    <rect x="116" y="216" width="280" height="80" rx="16" fill="#ffffff"/>
  </g>

  <!-- Golden ECG Vital Heartbeat Line -->
  <path d="M120 256 L190 256 L220 200 L256 320 L290 220 L320 256 L392 256" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Stethoscope / Heart Accent -->
  <circle cx="256" cy="146" r="12" fill="#10b981"/>
</svg>
